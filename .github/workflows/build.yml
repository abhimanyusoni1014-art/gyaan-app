name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter project banao
        run: |
          flutter create --org com.simune --project-name simune --platforms android .
          flutter pub add http shared_preferences
          flutter pub add --dev flutter_launcher_icons

      - name: App icon lagao
        run: |
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n  adaptive_icon_background: "#08080C"\n  adaptive_icon_foreground: "icon_fg.png"\n' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons

      - name: Internet permission aur app ka naam
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Simune"#' android/app/src/main/AndroidManifest.xml

      - name: APK banao
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SB_URL=$(printf '%s' "$SB_URL" | tr -d '[:space:]')
          SB_KEY=$(printf '%s' "$SB_KEY" | tr -d '[:space:]')
          flutter build apk --release --dart-define=SUPABASE_URL="$SB_URL" --dart-define=SUPABASE_ANON_KEY="$SB_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: simune-apk
          path: build/app/outputs/flutter-apk/app-release.apk

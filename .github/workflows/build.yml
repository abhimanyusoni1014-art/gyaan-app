name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter project banao
        run: |
          flutter create --org com.gyaansaathi --project-name gyaan_saathi --platforms android .
          flutter pub add http shared_preferences

      - name: Internet permission aur app ka naam
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Gyaan Saathi"#' android/app/src/main/AndroidManifest.xml

      - name: APK banao
        run: flutter build apk --release --dart-define=APP_SECRET=${{ secrets.APP_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: gyaan-saathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
